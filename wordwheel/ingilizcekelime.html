<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Wheel - English Vocabulary Game</title>
    <!-- Cache-busting version query string -->
    <link rel="stylesheet" href="style.css?v=2.2">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <div id="app">
        <!-- Landing Page: Group Generation -->
        <section id="landing-page" class="active">
            <div class="top-nav-bar">
                <a href="../oyunlar.html" class="nav-back-btn" id="nav-back-landing">⬅️ Games Menu</a>
                
                <!-- Custom Modern Language Selector -->
                <div class="lang-selector-container">
                    <button type="button" class="lang-btn" id="landing-lang-btn" aria-haspopup="true" aria-expanded="false">
                        <span class="lang-globe">🌐</span>
                        <span class="lang-current-label">English</span>
                        <span class="lang-arrow">▾</span>
                    </button>
                    <div class="lang-dropdown-menu hidden" id="landing-lang-menu">
                        <button type="button" class="lang-opt" data-lang="en">🇬🇧 English</button>
                        <button type="button" class="lang-opt" data-lang="tr">🇹🇷 Türkçe</button>
                        <button type="button" class="lang-opt" data-lang="es">🇪🇸 Español</button>
                        <button type="button" class="lang-opt" data-lang="fr">🇫🇷 Français</button>
                        <button type="button" class="lang-opt" data-lang="de">🇩🇪 Deutsch</button>
                        <button type="button" class="lang-opt" data-lang="it">🇮🇹 Italiano</button>
                        <button type="button" class="lang-opt" data-lang="pt">🇵🇹 Português</button>
                        <button type="button" class="lang-opt" data-lang="ru">🇷🇺 Русский</button>
                        <button type="button" class="lang-opt" data-lang="ar">🇸🇦 العربية</button>
                        <button type="button" class="lang-opt" data-lang="zh">🇨🇳 中文</button>
                        <button type="button" class="lang-opt" data-lang="ja">🇯🇵 日本語</button>
                        <button type="button" class="lang-opt" data-lang="ko">🇰🇷 한국어</button>
                    </div>
                </div>
            </div>

            <div id="fun-title" class="colorful-title"></div>

            <button id="generate-groups-btn" class="primary-btn">Create Groups</button>
            <div id="groups-container" class="groups-grid hidden"></div>
            <button id="start-game-btn" class="primary-btn hidden">Start Game</button>
            <div id="welcome-title" class="colorful-title" style="margin-top: 30px;"></div>
        </section>

        <!-- Game Page -->
        <section id="game-page" class="hidden">
            <header class="game-header">
                <div class="top-nav-bar game-header-bar">
                    <a href="../oyunlar.html" class="nav-back-btn" id="nav-back-game">⬅️ Games Menu</a>
                    <div class="round-badge" id="round-display">Round 1 / 4</div>
                    
                    <!-- Custom Modern Language Selector -->
                    <div class="lang-selector-container">
                        <button type="button" class="lang-btn" id="game-lang-btn" aria-haspopup="true" aria-expanded="false">
                            <span class="lang-globe">🌐</span>
                            <span class="lang-current-label">English</span>
                            <span class="lang-arrow">▾</span>
                        </button>
                        <div class="lang-dropdown-menu hidden" id="game-lang-menu">
                            <button type="button" class="lang-opt" data-lang="en">🇬🇧 English</button>
                            <button type="button" class="lang-opt" data-lang="tr">🇹🇷 Türkçe</button>
                            <button type="button" class="lang-opt" data-lang="es">🇪🇸 Español</button>
                            <button type="button" class="lang-opt" data-lang="fr">🇫🇷 Français</button>
                            <button type="button" class="lang-opt" data-lang="de">🇩🇪 Deutsch</button>
                            <button type="button" class="lang-opt" data-lang="it">🇮🇹 Italiano</button>
                            <button type="button" class="lang-opt" data-lang="pt">🇵🇹 Português</button>
                            <button type="button" class="lang-opt" data-lang="ru">🇷🇺 Русский</button>
                            <button type="button" class="lang-opt" data-lang="ar">🇸🇦 العربية</button>
                            <button type="button" class="lang-opt" data-lang="zh">🇨🇳 中文</button>
                            <button type="button" class="lang-opt" data-lang="ja">🇯🇵 日本語</button>
                            <button type="button" class="lang-opt" data-lang="ko">🇰🇷 한국어</button>
                        </div>
                    </div>
                </div>

                <div class="score-board">
                    <div class="team-score" id="score-team-1">
                        <span class="team-icon">⭐</span>
                        <span class="team-name">Stars:</span>
                        <span class="score-num" id="val-team-1">0</span>
                    </div>
                    <div class="team-score" id="score-team-2">
                        <span class="team-icon">💖</span>
                        <span class="team-name">Hearts:</span>
                        <span class="score-num" id="val-team-2">0</span>
                    </div>
                    <div class="team-score" id="score-team-3">
                        <span class="team-icon">✨</span>
                        <span class="team-name">Shine:</span>
                        <span class="score-num" id="val-team-3">0</span>
                    </div>
                    <div class="team-score" id="score-team-4">
                        <span class="team-icon">☁️</span>
                        <span class="team-name">Clouds:</span>
                        <span class="score-num" id="val-team-4">0</span>
                    </div>
                </div>
            </header>

            <div class="game-content">
                <!-- Wheel Side -->
                <div class="wheel-container">
                    <div class="wheel-pointer">⬇</div>
                    <canvas id="wheel-canvas" width="400" height="400"></canvas>
                    <button id="spin-btn">SPIN</button>
                </div>

                <!-- Baamboozle Question & Choices Side -->
                <div class="question-area">
                    <div id="current-player-display">
                        <span id="turn-label" class="turn-label">Turn:</span>
                        <span id="player-name" class="player-highlight">Spin the Wheel!</span>
                    </div>

                    <!-- Question Card (Image Display) -->
                    <div class="question-card" id="question-card">
                        <div id="question-placeholder" class="question-placeholder">
                            <div class="placeholder-icon">🎡</div>
                            <div id="placeholder-text" class="placeholder-text">Spin the wheel to reveal the question!</div>
                        </div>
                        <div id="question-image-box" class="question-image-box hidden">
                            <img id="word-image" src="" alt="Word Image">
                        </div>
                    </div>

                    <!-- Feedback message (Correct / Wrong) -->
                    <div id="feedback-message" class="feedback-message hidden"></div>

                    <!-- 3 Choices Buttons (Baamboozle Style - No A, B, C) -->
                    <div id="choices-container" class="choices-container hidden">
                        <!-- Rendered by JS -->
                    </div>

                    <!-- Game Controls -->
                    <div class="game-controls">
                        <button id="next-turn-btn" class="primary-btn hidden pulse-glow">Next Turn ➡️</button>
                        <button id="skip-word-btn" class="secondary-btn hidden">Change Question 🔄</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Script with cache busting -->
    <script src="script.js?v=2.2"></script>
</body>

</html>
